<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site em manutenção</title>
<style>
  :root { --fundo:#f4f7fb; --texto:#14283c; --suave:#51647a; --cartao:#fff; --borda:#d7e0ea; --marca:#0b5cab; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo:#0f1722; --texto:#e8eef5; --suave:#9fb0c3; --cartao:#172233; --borda:#2a3a50; --marca:#6db3f2; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--fundo); color:var(--texto);
         font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:30rem; background:var(--cartao); border:1px solid var(--borda);
         border-radius:16px; padding:32px 28px; text-align:center; }
  h1 { margin:0 0 12px; font-size:1.5rem; color:var(--marca); }
  p { margin:0 0 12px; color:var(--suave); }
  p:last-child { margin-bottom:0; }
  .icone { font-size:2.5rem; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <div class="icone" aria-hidden="true">🛠️</div>
  <h1>Site em manutenção</h1>
  <p>Este site está temporariamente fora do ar.</p>
  <p>Para saber horários e atendimentos, procure diretamente a sua Unidade Básica de Saúde ou ligue para a Secretaria de Saúde de Brusque.</p>
  <p><strong>Em caso de urgência, ligue 192 (SAMU).</strong></p>
</main>
</body>
</html>
