<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unidades de Saúde</title>
<meta name="description" content="Lista das unidades de saúde publicadas neste endereço — horários, avisos e telefones de cada uma.">
<meta name="theme-color" content="#02301A">
<style>
  :root{
    --verde: #02301A;
    --fundo: #F6F5F0;
    --texto: #1a1a1a;
    --borda: #d8d5c8;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 3rem;
  }
  header{
    background: var(--verde);
    color: #fff;
    padding: 2rem 1.25rem;
    text-align: center;
  }
  header h1{
    margin: 0;
    font-size: 1.4rem;
  }
  header p{
    margin: 0.4rem 0 0;
    opacity: 0.85;
    font-size: 0.95rem;
  }
  ul{
    list-style: none;
    margin: 1.5rem 0 0;
    padding: 0;
  }
  li + li{
    margin-top: 0.75rem;
  }
  a.unidade{
    display: block;
    padding: 1rem 1.1rem;
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 10px;
    text-decoration: none;
    color: var(--texto);
    font-weight: 600;
  }
  a.unidade:hover, a.unidade:focus{
    border-color: var(--verde);
  }
  a.unidade span{
    display: block;
    font-weight: 400;
    font-size: 0.85rem;
    color: #555;
    margin-top: 0.2rem;
  }
</style>
</head>
<body>

<header>
  <h1>Unidades de Saúde</h1>
  <p>Escolha a unidade para ver horários, avisos e telefones.</p>
</header>

<div class="wrap">
  <!-- Cada UBS publicada neste domínio ganha uma linha aqui — é só copiar
       o <li> abaixo ao replicar a pasta para uma nova unidade. -->
  <ul>
    <li>
      <a class="unidade" href="ubs-paqueta/">
        UBS Paquetá
        <span>Bairro Paquetá — Brusque/SC</span>
      </a>
    </li>
  </ul>
</div>

</body>
</html>
